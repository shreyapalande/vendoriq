[pytest]
# Run from backend/: makes `import app...` work in tests.
pythonpath = .
testpaths = tests
# Temp files (e.g. rendered test PDFs) go to backend/.pytest_tmp/ (gitignored),
# not the system temp folder. pytest clears this folder at the start of each run.
# --strict-markers: a typo like @pytest.mark.dbb is an error, not a silent no-op.
addopts = --basetemp=.pytest_tmp --strict-markers
markers =
    db: needs the Postgres test database (docker compose up -d db). Skip with: pytest -m "not db"
